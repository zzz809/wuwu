<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        .error-container {
            text-align: center;
            background: #fff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
            position: relative;
            animation: fadeIn 1s ease-out;
        }

        .error-container h1 {
            font-size: 5em;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .error-container h2 {
            font-size: 1.8em;
            color: #555;
            margin-bottom: 30px;
        }

        .error-container p {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }

        .countdown {
            font-size: 2em;
            font-weight: bold;
            color: #f39c12;
        }

        .error-container button {
            background-color: #3498db;
            color: #fff;
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .error-container button:hover {
            background-color: #2980b9;
        }

        .footer {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 20px;
        }

        .footer a {
            text-decoration: none;
            color: #3498db;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #2980b9;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>哎呀！页面丢失了...</h2>
        <p>您访问的页面无法找到!</p>
    </div>
</body>
</html>
