          <h2 class="h2_tem1">一、中国科学院大学常用网站</h2>

          <h2 class="h2_tem1">二、学校主题的PPT模板</h2>
          <p>链接（直接点击下载即可）：
            <a class="fangsong-text" style="color: black;font-weight: bold;text-decoration: none;" href="\document\中国科学院大学ppt.zip">

  <div id="footer"></div>
  <script src="/js/fetch_main.js"></script>

<script>
  // 链接数据
  const links = [
    { title: "入学通知网", url: "https://welcome.ucas.ac.cn/index.php/zh-cn/" },
    { title: "入学新生本人信息", url: "https://welcome.ucas.ac.cn/index.php/zh-cn/gxfw/xinsheng" },
    { title: "入学学院通知", url: "https://welcome.ucas.ac.cn/index.php/zh-cn/gxfw/tongzhi" },
    { title: "教育云平台", url: "https://sep.ucas.ac.cn" },
    { title: "选课系统", url: "http://xkgo.ucas.ac.cn:3000/courseManage/main" },
    { title: "图书馆", url: "http://lib.ucas.ac.cn/" },
    { title: "校园网", url: "https://portal.ucas.ac.cn/" },
    { title: "奖助学金系统", url: "https://scholarship.ucas.ac.cn/notice/yjsindex" },
    { title: "中科院邮箱", url: "https://mail.cstnet.cn/" },
    { title: "综合信息网", url: "https://onestop.ucas.ac.cn/index.html" },
    { title: "外语系官网", url: "https://foreign.ucas.ac.cn/" },
    { title: "校内通知公告", url: "https://onestop.ucas.ac.cn/home/news/0783be9f-54e9-4ed3-a2ca-996c2076eeae/1" },
  ];
  const container = document.getElementById("link-list");
  links.forEach((link, index) => {
    const p = document.createElement("p");
    const a = document.createElement("a");
    a.href = link.url;
    a.target = "_blank";
    a.className = "fangsong-text";
    a.style.color = "black";
    a.style.textDecoration = "none";
    a.textContent = link.url;

    // 拼接序号和标题
    p.textContent = `${index + 1}. ${link.title}：`;
    p.appendChild(a);
    container.appendChild(p);
  });
</script>
